<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>高速ミニゲーミング</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
      position: fixed;
      top: 0;
      left: 0;
      background-color: #121212;
      color: #ffffff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      user-select: none;
      -webkit-user-select: none;
      -webkit-touch-callout: none;
      touch-action: none;
    }

    .game-container {
      width: 100%;
      max-width: 400px;
      height: 100%;
      max-height: 600px;
      background-color: #1e1e1e;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      border: 2px solid #333;
    }

    /* 指示エリア */
    .instruction-area {
      height: 100px;
      background-color: #2a2a2a;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 10px;
      border-bottom: 2px solid #333;
      flex-shrink: 0;
    }

    .instruction-text {
      font-size: 24px;
      font-weight: bold;
      text-align: center;
      color: #ffcc00;
    }

    /* プレイエリア */
    .play-area {
      flex: 1;
      position: relative;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: #141414;
      padding: 20px;
      touch-action: none;
    }

    /* ステータスエリア */
    .status-area {
      height: 120px;
      background-color: #2a2a2a;
      padding: 15px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      border-top: 2px solid #333;
      flex-shrink: 0;
    }

    .status-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 18px;
      font-weight: bold;
    }

    .time-text {
      font-family: monospace;
      color: #00ffcc;
      font-size: 20px;
    }

    .gauge-container {
      width: 100%;
      height: 16px;
      background-color: #444;
      border-radius: 8px;
      overflow: hidden;
    }

    .gauge-bar {
      width: 100%;
      height: 100%;
      background-color: #00ffcc;
      transition: none; 
    }

    /* UI要素 */
    .btn {
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      color: #fff;
      transition: transform 0.1s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

    .btn:active {
      transform: scale(0.95);
    }

    .btn-big {
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background-color: #ff4757;
      font-size: 20px;
      box-shadow: 0 6px 0 #ea2027;
    }

    .btn-big:active {
      box-shadow: 0 2px 0 #ea2027;
      transform: translateY(4px);
    }

    .grid-4 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      width: 100%;
      height: 100%;
    }

    .grid-btn {
      font-size: 32px;
      background-color: #3742fa;
    }

    .color-btn {
      width: 100%;
      height: 100%;
    }

    /* スワイプエリア */
    .swipe-area {
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 80px;
      color: #00ffcc;
      background-color: #222;
      border-radius: 12px;
      border: 2px dashed #444;
    }

    /* 左右比較用UI */
    .compare-container {
      display: flex;
      width: 100%;
      height: 100%;
      gap: 15px;
    }

    .compare-box {
      flex: 1;
      background-color: #222;
      border: 2px solid #444;
      border-radius: 8px;
      position: relative;
      cursor: pointer;
      overflow: hidden;
    }

    .compare-box:active {
      border-color: #00ffcc;
    }

    .dot {
      position: absolute;
      width: 16px;
      height: 16px;
      background-color: #ffcc00;
      border-radius: 50%;
      transform: translate(-50%, -50%);
    }

    .start-screen, .gameover-screen {
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
      width: 100%;
      height: 100%;
      justify-content: center;
    }

    .gameover-screen {
      cursor: pointer;
    }

    .mode-btn {
      width: 80%;
      padding: 15px;
      font-size: 20px;
    }

    .btn-easy {
      background-color: #2ed573;
      color: #000;
    }

    .btn-hard {
      background-color: #ff4757;
      color: #fff;
    }

    .tap-notice {
      margin-top: 10px;
      font-size: 14px;
      color: #888;
    }
  </style>
</head>
<body>

<div class="game-container">
  <div class="instruction-area">
    <div id="instruction" class="instruction-text">モードを選択</div>
  </div>
  
  <div id="playArea" class="play-area">
    <div id="screenContent" class="start-screen">
      <button class="btn mode-btn btn-easy" onclick="startGame(2.0)">かんたん (2秒)</button>
      <button class="btn mode-btn btn-hard" onclick="startGame(1.0)">むずかしい (1秒)</button>
    </div>
  </div>
  
  <div class="status-area">
    <div class="status-info">
      <div>成功数: <span id="scoreText">0</span></div>
      <div id="timeText" class="time-text">0.000sec</div>
    </div>
    <div class="gauge-container">
      <div id="gaugeBar" class="gauge-bar"></div>
    </div>
  </div>
</div>

<script>
  // ブラウザのタッチ操作防止
  document.addEventListener('touchstart', function(event) {
    if (event.touches.length > 1) {
      event.preventDefault();
    }
  }, { passive: false });

  let lastTouchEnd = 0;
  document.addEventListener('touchend', function(event) {
    const now = (new Date()).getTime();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, false);

  let limitTime = 2.0;
  let score = 0;
  let timerId = null;
  let currentTask = null;
  let isPlaying = false;
  let canReturnToTitle = false;

  const instructionEl = document.getElementById('instruction');
  const playAreaEl = document.getElementById('playArea');
  const scoreTextEl = document.getElementById('scoreText');
  const timeTextEl = document.getElementById('timeText');
  const gaugeBarEl = document.getElementById('gaugeBar');

  // 全ミニゲームのリスト
  const minigames = [
    taskBigButton,
    taskOddNumber,
    taskEvenNumber,
    taskDontTouch,
    taskColorButton,
    taskRapidTap,
    taskSwipe,
    taskOddShape,
    taskMath,
    taskMoreDots,
    taskLessDots
  ];

  function showStartScreen() {
    instructionEl.textContent = "モードを選択";
    playAreaEl.innerHTML = `
      <div class="start-screen">
        <button class="btn mode-btn btn-easy" onclick="startGame(2.0)">かんたん (2秒)</button>
        <button class="btn mode-btn btn-hard" onclick="startGame(1.0)">むずかしい (1秒)</button>
      </div>
    `;
    updateTimerDisplay(0);
  }

  function startGame(selectedTime) {
    limitTime = selectedTime;
    score = 0;
    isPlaying = true;
    scoreTextEl.textContent = score;
    nextGame();
  }

  function gameOver(reason = "時間切れ！") {
    isPlaying = false;
    clearInterval(timerId);
    instructionEl.textContent = "ゲームオーバー";
    
    updateTimerDisplay(limitTime);
    canReturnToTitle = false;
    
    playAreaEl.innerHTML = `
      <div class="gameover-screen" onclick="handleGameOverTap()">
        <p style="font-size: 18px; color: #ff6b6b;">${reason}</p>
        <p style="font-size: 22px;">記録: ${score} 回成功</p>
        <div id="tapNotice" class="tap-notice">...</div>
      </div>
    `;

    setTimeout(() => {
      canReturnToTitle = true;
      const noticeEl = document.getElementById('tapNotice');
      if (noticeEl) {
        noticeEl.style.color = '#00ffcc';
        noticeEl.textContent = 'タップしてタイトルへ';
      }
    }, 500);
  }

  function handleGameOverTap() {
    if (isPlaying) return;
    if (!canReturnToTitle) return;
    showStartScreen();
  }

  function success() {
    clearInterval(timerId);
    score++;
    scoreTextEl.textContent = score;
    nextGame();
  }

  function nextGame() {
    playAreaEl.innerHTML = '';
    const randomIndex = Math.floor(Math.random() * minigames.length);
    minigames[randomIndex]();
    startTimer();
  }

  function startTimer() {
    clearInterval(timerId);
    const startTime = Date.now();
    updateTimerDisplay(0);

    timerId = setInterval(() => {
      if (!isPlaying) return;
      
      const elapsedTime = (Date.now() - startTime) / 1000;
      updateTimerDisplay(elapsedTime);

      if (elapsedTime >= limitTime) {
        clearInterval(timerId);
        if (currentTask === 'dont_touch') {
          success();
        } else {
          gameOver("タイムオーバー！");
        }
      }
    }, 10);
  }

  function updateTimerDisplay(elapsedTime) {
    const remainingTime = Math.max(0, limitTime - elapsedTime);
    timeTextEl.textContent = remainingTime.toFixed(3) + "sec";
    
    let value = 1 - (elapsedTime / limitTime);
    value = Math.max(0, Math.min(1, value));
    
    const percentage = value * 100;
    gaugeBarEl.style.width = percentage + "%";
    
    if (percentage < 30) {
      gaugeBarEl.style.backgroundColor = "#ff4757";
    } else {
      gaugeBarEl.style.backgroundColor = "#00ffcc";
    }
  }

  // --- 既存のミニゲーム ---

  function taskBigButton() {
    currentTask = 'big_button';
    instructionEl.textContent = "早く押せ！";
    
    const btn = document.createElement('button');
    btn.className = 'btn btn-big';
    btn.textContent = '押せ！';
    btn.onclick = () => success();
    
    playAreaEl.appendChild(btn);
  }

  function taskOddNumber() {
    currentTask = 'odd_number';
    instructionEl.textContent = "奇数を押せ！";
    
    const evens = [0, 2, 4, 6, 8];
    const odds = [1, 3, 5, 7, 9];
    
    const target = odds[Math.floor(Math.random() * odds.length)];
    const dummy1 = evens[Math.floor(Math.random() * evens.length)];
    let dummy2 = evens[Math.floor(Math.random() * evens.length)];
    let dummy3 = evens[Math.floor(Math.random() * evens.length)];

    const numbers = [
      { val: target, isCorrect: true },
      { val: dummy1, isCorrect: false },
      { val: dummy2, isCorrect: false },
      { val: dummy3, isCorrect: false }
    ].sort(() => Math.random() - 0.5);

    renderGridButtons(numbers);
  }

  function taskEvenNumber() {
    currentTask = 'even_number';
    instructionEl.textContent = "偶数を押せ！";
    
    const evens = [0, 2, 4, 6, 8];
    const odds = [1, 3, 5, 7, 9];
    
    const target = evens[Math.floor(Math.random() * evens.length)];
    const dummy1 = odds[Math.floor(Math.random() * odds.length)];
    let dummy2 = odds[Math.floor(Math.random() * odds.length)];
    let dummy3 = odds[Math.floor(Math.random() * odds.length)];

    const numbers = [
      { val: target, isCorrect: true },
      { val: dummy1, isCorrect: false },
      { val: dummy2, isCorrect: false },
      { val: dummy3, isCorrect: false }
    ].sort(() => Math.random() - 0.5);

    renderGridButtons(numbers);
  }

  function taskDontTouch() {
    currentTask = 'dont_touch';
    instructionEl.textContent = "触るな！";
    
    const btn = document.createElement('button');
    btn.className = 'btn btn-big';
    btn.style.backgroundColor = '#ffa500';
    btn.textContent = '押すな';
    btn.onclick = () => gameOver("触ってしまった！");
    
    playAreaEl.appendChild(btn);
  }

  function taskColorButton() {
    currentTask = 'color_button';
    
    const colors = [
      { name: "赤", code: "#ff4757" },
      { name: "青", code: "#1e90ff" },
      { name: "緑", code: "#2ed573" },
      { name: "黄", code: "#ffa500" }
    ];

    const targetColor = colors[Math.floor(Math.random() * colors.length)];
    instructionEl.textContent = `「${targetColor.name}」を押せ！`;

    const shuffled = [...colors].sort(() => Math.random() - 0.5);

    const grid = document.createElement('div');
    grid.className = 'grid-4';

    shuffled.forEach(c => {
      const btn = document.createElement('button');
      btn.className = 'btn color-btn';
      btn.style.backgroundColor = c.code;
      btn.onclick = () => {
        if (c.name === targetColor.name) {
          success();
        } else {
          gameOver("違う色を押した！");
        }
      };
      grid.appendChild(btn);
    });

    playAreaEl.appendChild(grid);
  }

  // --- 新規追加ミニゲーム ---

  // 1. 連打せよ（3回）
  function taskRapidTap() {
    currentTask = 'rapid_tap';
    let count = 3;
    instructionEl.textContent = "3回連打せよ！";

    const btn = document.createElement('button');
    btn.className = 'btn btn-big';
    btn.style.backgroundColor = '#ff6b81';
    btn.textContent = `あと ${count} 回`;

    btn.onclick = () => {
      count--;
      if (count <= 0) {
        success();
      } else {
        btn.textContent = `あと ${count} 回`;
      }
    };

    playAreaEl.appendChild(btn);
  }

  // 2. なぞり（スワイプ）
  function taskSwipe() {
    currentTask = 'swipe';
    const directions = [
      { name: '上', arrow: '↑', dx: 0, dy: -1 },
      { name: '下', arrow: '↓', dx: 0, dy: 1 },
      { name: '左', arrow: '←', dx: -1, dy: 0 },
      { name: '右', arrow: '→', dx: 1, dy: 0 }
    ];

    const target = directions[Math.floor(Math.random() * directions.length)];
    instructionEl.textContent = `「${target.arrow}」にスワイプ！`;

    const area = document.createElement('div');
    area.className = 'swipe-area';
    area.textContent = target.arrow;

    let startX = 0, startY = 0;

    const handleStart = (x, y) => {
      startX = x;
      startY = y;
    };

    const handleEnd = (x, y) => {
      const diffX = x - startX;
      const diffY = y - startY;
      const minSwipeDistance = 30; // 最小スワイプ距離

      if (Math.abs(diffX) < minSwipeDistance && Math.abs(diffY) < minSwipeDistance) return;

      // 主なスワイプ方向を判定
      let swipeDx = 0;
      let swipeDy = 0;

      if (Math.abs(diffX) > Math.abs(diffY)) {
        swipeDx = diffX > 0 ? 1 : -1;
      } else {
        swipeDy = diffY > 0 ? 1 : -1;
      }

      if (swipeDx === target.dx && swipeDy === target.dy) {
        success();
      } else {
        gameOver("違う方向にスワイプ！");
      }
    };

    // タッチ/マウス イベント処理
    area.addEventListener('touchstart', e => {
      const t = e.touches[0];
      handleStart(t.clientX, t.clientY);
    });

    area.addEventListener('touchend', e => {
      const t = e.changedTouches[0];
      handleEnd(t.clientX, t.clientY);
    });

    area.addEventListener('mousedown', e => handleStart(e.clientX, e.clientY));
    area.addEventListener('mouseup', e => handleEnd(e.clientX, e.clientY));

    playAreaEl.appendChild(area);
  }

  // 3. 仲間外れ（図形：⚫︎ ◼️ × ▲ ★ から2種）
  function taskOddShape() {
    currentTask = 'odd_shape';
    instructionEl.textContent = "仲間外れを押せ！";

    const shapes = ['⚫︎', '◼️', '×', '▲', '★'];
    // ランダムに2種選択
    const shuffledShapes = shapes.sort(() => Math.random() - 0.5);
    const mainShape = shuffledShapes[0]; // 3個の側
    const oddShape = shuffledShapes[1];  // 1個（正解）の側

    const items = [
      { val: oddShape, isCorrect: true },
      { val: mainShape, isCorrect: false },
      { val: mainShape, isCorrect: false },
      { val: mainShape, isCorrect: false }
    ].sort(() => Math.random() - 0.5);

    renderGridButtons(items);
  }

  // 4. 簡単な計算（一桁：加減乗）
  function taskMath() {
    currentTask = 'math';
    const ops = ['+', '-', '×'];
    const op = ops[Math.floor(Math.random() * ops.length)];

    let a = Math.floor(Math.random() * 9) + 1; // 1~9
    let b = Math.floor(Math.random() * 9) + 1;
    let answer = 0;

    if (op === '+') {
      answer = a + b;
    } else if (op === '-') {
      if (a < b) [a, b] = [b, a]; // 負の数にならないように調整
      answer = a - b;
    } else if (op === '×') {
      answer = a * b;
    }

    instructionEl.textContent = `${a} ${op} ${b} = ?`;

    // ダミー選択肢（被らないように生成）
    const dummies = new Set();
    while (dummies.size < 3) {
      let d = answer + (Math.floor(Math.random() * 7) - 3);
      if (d >= 0 && d !== answer) dummies.add(d);
    }

    const dummyArr = Array.from(dummies);
    const options = [
      { val: answer, isCorrect: true },
      { val: dummyArr[0], isCorrect: false },
      { val: dummyArr[1], isCorrect: false },
      { val: dummyArr[2], isCorrect: false }
    ].sort(() => Math.random() - 0.5);

    renderGridButtons(options);
  }

  // 5. 多い方を押せ
  function taskMoreDots() {
    currentTask = 'more_dots';
    instructionEl.textContent = "ドットが「多い」方を押せ！";
    renderDotComparison(true);
  }

  // 6. 少ない方を押せ
  function taskLessDots() {
    currentTask = 'less_dots';
    instructionEl.textContent = "ドットが「少ない」方を押せ！";
    renderDotComparison(false);
  }

  // ドット比較描画用共通関数
  function renderDotComparison(targetIsMore) {
    let countA = Math.floor(Math.random() * 8) + 3; // 3~10個
    let countB = Math.floor(Math.random() * 8) + 3;
    while (countA === countB) {
      countB = Math.floor(Math.random() * 8) + 3;
    }

    const container = document.createElement('div');
    container.className = 'compare-container';

    const boxA = createDotBox(countA);
    const boxB = createDotBox(countB);

    const isAMore = countA > countB;
    const isACorrect = targetIsMore ? isAMore : !isAMore;

    boxA.onclick = () => {
      if (isACorrect) success();
      else gameOver("間違えた！");
    };

    boxB.onclick = () => {
      if (!isACorrect) success();
      else gameOver("間違えた！");
    };

    container.appendChild(boxA);
    container.appendChild(boxB);
    playAreaEl.appendChild(container);
  }

  // ランダムにドットを配置した要素を作るヘルパー関数
  function createDotBox(count) {
    const box = document.createElement('div');
    box.className = 'compare-box';

    for (let i = 0; i < count; i++) {
      const dot = document.createElement('div');
      dot.className = 'dot';
      // 枠内にランダムに配置 (15%~85%の範囲)
      const x = Math.floor(Math.random() * 70) + 15;
      const y = Math.floor(Math.random() * 70) + 15;
      dot.style.left = x + '%';
      dot.style.top = y + '%';
      box.appendChild(dot);
    }

    return box;
  }

  // ボタン描画用の共通ヘルパー
  function renderGridButtons(items) {
    const grid = document.createElement('div');
    grid.className = 'grid-4';

    items.forEach(item => {
      const btn = document.createElement('button');
      btn.className = 'btn grid-btn';
      btn.textContent = item.val;
      btn.onclick = () => {
        if (item.isCorrect) {
          success();
        } else {
          gameOver("お手つき！");
        }
      };
      grid.appendChild(btn);
    });

    playAreaEl.appendChild(grid);
  }
</script>

</body>
</html>
